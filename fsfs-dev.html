<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fsfs 개발자 모드</title>
<style>
:root{--bg:#f6f4f1;--p:#fff;--ink:#2b2622;--mute:#8a8078;--line:#e4dfd9;--acc:#e07a5f;--accbg:#fbe9e3;--chk:#e9e5df}
@media(prefers-color-scheme:dark){:root{--bg:#1e1c1a;--p:#292623;--ink:#efeae4;--mute:#a39a91;--line:#3b3733;--acc:#f0917a;--accbg:#4a312a;--chk:#33302c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h1{font-size:17px;margin:0 0 12px}h2{margin:0 0 8px;font-size:13px;color:var(--mute)}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
button{cursor:pointer;background:none}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.cols{display:grid;grid-template-columns:320px 1fr;gap:12px;align-items:start}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.list{max-height:68vh;overflow:auto}
.it{display:flex;gap:8px;align-items:center;padding:5px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.it.on{border-color:var(--acc);background:var(--accbg)}
.th{width:44px;height:56px;flex:none;background:var(--chk);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.th img{max-width:100%;max-height:100%}
.tag{font-size:11px;color:var(--mute)}
.src{border:1px dashed var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.msg{font-size:12px;color:var(--mute);min-height:18px;margin-top:6px}.err{color:#d33}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<h1>👗 fsfs 개발자 모드</h1>

<details class="card"><summary>연결 설정</summary>
  <div class="row" style="margin-top:10px">
    <label>Supabase 주소<input id="c_sb" size="38"></label>
    <label>Supabase anon 키<input id="c_anon" size="38"></label>
    <label>업로드 Worker 주소<input id="c_worker" size="34"></label>
    <label>에셋 공개 주소 (R2)<input id="c_pub" size="34" placeholder="https://assets.내도메인.com"></label>
    <label>기준 캔버스 가로<input id="c_cw" type="number" style="width:90px"></label>
    <label>세로<input id="c_ch" type="number" style="width:90px"></label>
    <label>축소 비율<input id="c_scale" type="number" step="0.05" style="width:80px"></label>
    <button id="cfgsave">설정 저장</button>
  </div>
</details>

<div class="card" id="login">
  <h2>관리자 로그인</h2>
  <div class="row"><label>이메일<input id="em" type="email"></label><label>비밀번호<input id="pw" type="password"></label><button class="pri" id="go">로그인</button></div>
</div>

<div id="main" hidden>
  <div class="card">
    <h2>빠른 등록 — 전체 캔버스 크기로 내보낸 PNG를 여러 장 한꺼번에 선택하세요 (파일명이 의상 이름이 돼요)</h2>
    <div class="row"><label>파츠<select id="np"></select></label>
      <label>PNG 파일<input id="nf" type="file" accept="image/png" multiple></label>
      <button class="pri" id="bulk">등록</button><button id="exp">JSON 백업</button></div>
  </div>
  <div class="cols">
    <div class="card"><div class="row"><select id="fp"></select><input id="q" placeholder="이름 검색" style="flex:1;min-width:80px"></div><div class="list" id="list"></div></div>
    <div class="card" id="ed"></div>
  </div>
</div>
<div class="msg" id="msg"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const DEF={sb:'https://rtvvajhsnwkkrmncyfbs.supabase.co',anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk',worker:'https://fsfs.jjojjolonglong.workers.dev',pub:'',cw:2480,ch:3508,scale:0.6};
let cfg={...DEF};try{Object.assign(cfg,JSON.parse(localStorage.getItem('fsfsCfg')||'{}'))}catch(e){}
const F=['sb','anon','worker','pub','cw','ch','scale'];
F.forEach(k=>$('#c_'+k).value=cfg[k]);
$('#cfgsave').onclick=()=>{F.forEach(k=>cfg[k]=['cw','ch','scale'].includes(k)?+$('#c_'+k).value:$('#c_'+k).value.trim());try{localStorage.setItem('fsfsCfg',JSON.stringify(cfg))}catch(e){}msg('설정을 저장했어요')};

let S=null,parts=[],types=[],sets=[],items=[],cur=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opts=(a,v,l,sel,none)=>(none?`<option value="">${none}</option>`:'')+a.map(x=>`<option value="${esc(x[v])}"${x[v]===sel?' selected':''}>${esc(x[l])}</option>`).join('');
function msg(t,e){const m=$('#msg');m.textContent=t;m.className='msg'+(e?' err':'')}

// ---------- Supabase ----------
async function tok(){
  if(S&&S.exp-Date.now()<60000){
    const r=await fetch(cfg.sb+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:cfg.anon,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.rt})});
    const j=await r.json();if(r.ok)S={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000};
  }
  return S?S.at:cfg.anon;
}
async function sb(path,o={}){
  const r=await fetch(cfg.sb+path,{method:o.m||'GET',headers:{apikey:cfg.anon,Authorization:'Bearer '+await tok(),'Content-Type':'application/json',...(o.h||{})},body:o.b?JSON.stringify(o.b):undefined});
  if(!r.ok)throw new Error(await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}
$('#go').onclick=async()=>{
  try{
    msg('로그인 중…');
    const r=await fetch(cfg.sb+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.anon,'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});
    const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'로그인 실패');
    S={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000};
    const a=await sb('/rest/v1/fsfs_admin?select=user_id');
    if(a.length!==1){S=null;throw new Error('관리자로 등록된 계정이 아니에요 (fsfs_admin 확인)')}
    $('#login').hidden=true;$('#main').hidden=false;await load();msg('');
  }catch(e){msg(e.message,1)}
};

// ---------- 목록 ----------
const asset=it=>it.fsfs_asset.find(a=>a.kind==='game');
const imgUrl=it=>{const a=asset(it);return a&&cfg.pub?cfg.pub.replace(/\/$/,'')+'/'+a.file_key:''};
async function load(){
  [parts,types,sets,items]=await Promise.all([
    sb('/rest/v1/fsfs_part?select=*&order=sort'),sb('/rest/v1/fsfs_source_type?select=*'),
    sb('/rest/v1/fsfs_set?select=*&order=name'),sb('/rest/v1/fsfs_item?select=*,fsfs_asset(*),fsfs_source(*)&order=created_at.desc')]);
  const fp=$('#fp').value;
  $('#np').innerHTML=opts(parts,'code','label');
  $('#fp').innerHTML=opts(parts,'code','label',fp,'전체 파츠');
  renderList();
  cur=cur&&items.find(i=>i.id===cur.id)?mk(items.find(i=>i.id===cur.id)):null;renderEd();
}
const mk=it=>({...structuredClone(it),src:it.fsfs_source.map(s=>({...s}))});
function renderList(){
  const fp=$('#fp').value,q=$('#q').value.trim();
  $('#list').innerHTML=items.filter(i=>(!fp||i.part===fp)&&(!q||i.name.includes(q))).map(i=>{
    const u=imgUrl(i),p=parts.find(p=>p.code===i.part);
    return `<div class="it${cur&&cur.id===i.id?' on':''}" data-id="${i.id}"><div class="th">${u?`<img src="${u}">`:'🖼'}</div>
    <div><div>${esc(i.name)}</div><div class="tag">${esc(p?p.label:i.part)} · ${i.is_published?'공개':'초안'} · 경로 ${i.fsfs_source.length}</div></div></div>`}).join('')||'<div class="tag">의상이 없어요</div>';
}
$('#list').onclick=e=>{const d=e.target.closest('.it');if(!d)return;cur=mk(items.find(i=>i.id===d.dataset.id));renderList();renderEd()};
$('#fp').onchange=$('#q').oninput=renderList;

// ---------- 이미지 처리 / 업로드 ----------
async function proc(file){
  const bmp=await createImageBitmap(file),CW=bmp.width,CH=bmp.height;
  if(CW!==cfg.cw||CH!==cfg.ch)throw new Error(`캔버스 크기가 달라요 (${CW}×${CH}, 기준 ${cfg.cw}×${cfg.ch}). PSD 전체 캔버스 크기로 내보낸 PNG를 써주세요`);
  const c=document.createElement('canvas');c.width=CW;c.height=CH;
  const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(bmp,0,0);
  const d=g.getImageData(0,0,CW,CH).data;let x0=CW,y0=CH,x1=-1,y1=-1;
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++)if(d[(y*CW+x)*4+3]>0){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;y1=y}
  if(x1<0)throw new Error('투명하지 않은 픽셀이 없어요');
  const w=x1-x0+1,h=y1-y0+1,o=document.createElement('canvas');
  o.width=Math.max(1,Math.round(w*cfg.scale));o.height=Math.max(1,Math.round(h*cfg.scale));
  o.getContext('2d').drawImage(c,x0,y0,w,h,0,0,o.width,o.height);
  const blob=await new Promise(r=>o.toBlob(r,'image/webp',0.9));
  const sha=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))].map(b=>b.toString(16).padStart(2,'0')).join('');
  const f6=n=>+n.toFixed(6);
  return{blob,sha,x:f6(x0/CW),y:f6(y0/CH),w:f6(w/CW),h:f6(h/CH)};
}
async function wfetch(path,o){
  const r=await fetch(cfg.worker.replace(/\/$/,'')+path,{...o,headers:{Authorization:'Bearer '+await tok(),...(o.headers||{})}});
  if(!r.ok){let t=await r.text();try{t=JSON.parse(t).error||t}catch(e){}throw new Error('Worker: '+t)}
}
const wdel=key=>wfetch('/asset?key='+encodeURIComponent(key),{method:'DELETE'}).catch(()=>{});
async function putImage(id,file,ver){
  const r=await proc(file),key=`items/${id}/game.${r.sha.slice(0,8)}.webp`;
  await wfetch('/upload?key='+encodeURIComponent(key),{method:'PUT',headers:{'Content-Type':'image/webp'},body:r.blob});
  await sb('/rest/v1/fsfs_asset?on_conflict=item_id,kind',{m:'POST',h:{Prefer:'resolution=merge-duplicates,return=minimal'},
    b:{item_id:id,kind:'game',file_key:key,x:r.x,y:r.y,w:r.w,h:r.h,sha256:r.sha,bytes:r.blob.size,version:ver}});
}
$('#bulk').onclick=async()=>{
  const files=[...$('#nf').files];if(!files.length)return msg('PNG 파일을 선택해주세요',1);
  let n=0,ok=0;
  for(const f of files){
    try{
      msg(`등록 중 ${++n}/${files.length}: ${f.name}`);
      const id=crypto.randomUUID();
      await sb('/rest/v1/fsfs_item',{m:'POST',h:{Prefer:'return=minimal'},b:{id,part:$('#np').value,name:f.name.replace(/\.[^.]+$/,'')}});
      try{await putImage(id,f,1)}catch(e){await sb('/rest/v1/fsfs_item?id=eq.'+id,{m:'DELETE'});throw e}
      ok++;
    }catch(e){msg(`${f.name}: ${e.message}`,1);break}
  }
  $('#nf').value='';await load();if(ok===files.length)msg(`${ok}개 등록 완료 (초안 상태예요. 오른쪽에서 경로를 붙이고 공개하세요)`);
};

// ---------- 편집 ----------
function srcHtml(s,i){
  const t=types.find(t=>t.code===s.type)||types[0];
  return `<div class="src" data-i="${i}"><div class="row"><select class="st">${opts(types,'code','label',s.type)}</select><button class="rm">삭제</button></div>
  <div class="row">${(t.param_schema||[]).map(f=>`<label>${esc(f.label)}<input class="pf" data-k="${esc(f.key)}" type="${f.type==='number'?'number':'text'}" value="${esc(s.params&&s.params[f.key])}"></label>`).join('')}
  <label style="flex:1">메모<input class="sn" value="${esc(s.note)}"></label></div></div>`;
}
function renderSrcs(){$('#srcs').innerHTML=cur.src.map(srcHtml).join('')||'<div class="tag">획득 경로가 없어요 (게임에서 얻을 방법이 없는 상태)</div>'}
function renderEd(){
  const e=$('#ed');
  if(!cur){e.innerHTML='<div class="tag">왼쪽에서 의상을 고르거나, 위에서 새로 등록하세요</div>';return}
  const u=imgUrl(cur);
  e.innerHTML=`<div class="row" style="align-items:flex-start"><div class="th" style="width:100px;height:140px">${u?`<img src="${u}">`:'🖼'}</div>
  <div style="flex:1;min-width:230px;display:grid;gap:8px">
    <label>이름<input id="n" value="${esc(cur.name)}"></label>
    <div class="row"><label>파츠<select id="pt">${opts(parts,'code','label',cur.part)}</select></label>
      <label>세트<select id="se">${opts(sets,'id','name',cur.set_id,'없음')}</select></label>
      <label>새 세트<input id="ns" placeholder="이름" style="width:110px"></label><button id="nsb">만들기</button></div>
    <div class="row"><label style="flex:1">태그 (쉼표로 구분)<input id="tg" value="${esc((cur.tags||[]).join(', '))}"></label>
      <label>희귀도<input id="ra" type="number" min="1" max="5" value="${cur.rarity||1}" style="width:70px"></label></div>
    <label>메모<input id="no" value="${esc(cur.note)}"></label>
    <label>이미지 교체 (선택)<input id="rf" type="file" accept="image/png"></label>
    <label style="flex-direction:row;align-items:center;gap:6px"><input id="pu" type="checkbox"${cur.is_published?' checked':''}>공개 (체크하면 플레이어에게 보여요)</label>
  </div></div>
  <h2 style="margin-top:12px">획득 경로</h2><div id="srcs"></div>
  <div class="row"><button id="adds">+ 경로 추가</button><span style="flex:1"></span><button id="del">의상 삭제</button><button class="pri" id="save">저장</button></div>`;
  renderSrcs();
  $('#adds').onclick=()=>{cur.src.push({type:types[0].code,params:{},note:''});renderSrcs()};
  $('#nsb').onclick=async()=>{const n=$('#ns').value.trim();if(!n)return;try{const r=await sb('/rest/v1/fsfs_set',{m:'POST',h:{Prefer:'return=representation'},b:{name:n}});sets.push(r[0]);$('#se').innerHTML=opts(sets,'id','name',r[0].id,'없음')}catch(x){msg(x.message,1)}};
  $('#srcs').onchange=ev=>{const i=ev.target.closest('.src').dataset.i;if(ev.target.matches('.st')){cur.src[i].type=ev.target.value;cur.src[i].params={};renderSrcs()}};
  $('#srcs').oninput=ev=>{const s=cur.src[ev.target.closest('.src').dataset.i];
    if(ev.target.matches('.pf')){const v=ev.target.value;s.params=s.params||{};s.params[ev.target.dataset.k]=ev.target.type==='number'&&v!==''?Number(v):v}
    if(ev.target.matches('.sn'))s.note=ev.target.value};
  $('#srcs').onclick=ev=>{if(ev.target.matches('.rm')){cur.src.splice(ev.target.closest('.src').dataset.i,1);renderSrcs()}};
  $('#save').onclick=save;$('#del').onclick=del;
}
async function save(){
  try{
    msg('저장 중…');
    const patch={name:$('#n').value.trim(),part:$('#pt').value,set_id:$('#se').value||null,tags:$('#tg').value.split(',').map(s=>s.trim()).filter(Boolean),rarity:+$('#ra').value||1,note:$('#no').value||null,is_published:$('#pu').checked};
    const f=$('#rf').files[0],a=asset(cur);let oldKey=null;
    if(f){oldKey=a&&a.file_key;await putImage(cur.id,f,a?a.version+1:1)}
    await sb('/rest/v1/fsfs_item?id=eq.'+cur.id,{m:'PATCH',h:{Prefer:'return=minimal'},b:patch});
    const keep=cur.src.filter(s=>s.id).map(s=>s.id),gone=cur.fsfs_source.map(s=>s.id).filter(i=>!keep.includes(i));
    if(gone.length)await sb('/rest/v1/fsfs_source?id=in.('+gone.join(',')+')',{m:'DELETE'});
    for(const s of cur.src){const row={type:s.type,params:s.params||{},note:s.note||null};
      if(s.id)await sb('/rest/v1/fsfs_source?id=eq.'+s.id,{m:'PATCH',h:{Prefer:'return=minimal'},b:row});
      else await sb('/rest/v1/fsfs_source',{m:'POST',h:{Prefer:'return=minimal'},b:{...row,item_id:cur.id}})}
    if(oldKey)wdel(oldKey);
    await load();msg('저장했어요');
  }catch(e){msg(e.message,1)}
}
async function del(){
  if(!confirm(`"${cur.name}" 의상을 삭제할까요? (보유 기록도 함께 사라져요)`))return;
  try{const keys=cur.fsfs_asset.map(a=>a.file_key);await sb('/rest/v1/fsfs_item?id=eq.'+cur.id,{m:'DELETE'});keys.forEach(wdel);cur=null;await load();msg('삭제했어요')}catch(e){msg(e.message,1)}
}
$('#exp').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({parts,types,sets,items},null,1)],{type:'application/json'}));
  a.download='fsfs-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
};
</script>
</body>
</html>
